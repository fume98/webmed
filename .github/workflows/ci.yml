name: Pruebas y app de escritorio
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  servidor-docker:
    # Arma la imagen del servidor y prueba que arranca y guarda datos en un disco montado como root (como Railway).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agenda .
      - run: |
          sudo mkdir -p /tmp/datos && sudo chown root:root /tmp/datos
          docker run -d --name agenda -p 8080:8080 -v /tmp/datos:/data agenda
          for i in $(seq 1 20); do curl -sf localhost:8080/api/status && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/setup -H 'Content-Type: application/json' -d '{"nombre":"Prueba","email":"p@p.com","password":"clave1234"}' | grep -q token
          docker exec agenda sh -c 'ps -o user,args | grep -v grep | grep "server/server.js" | grep -q "^node"'
          sudo ls -la /tmp/datos | grep -q agenda.sqlite
          docker logs agenda

  escritorio:
    # Arma los instaladores al publicar una versión (tag v1.0.0, etc.) o a mano desde la pestaña Actions.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: pruebas
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: desktop }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: ignore
